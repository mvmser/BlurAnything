services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      BLURANYTHING_CORS_ORIGINS: http://localhost:8501
    volumes:
      - models:/app/models

  ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      BLURANYTHING_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  models:
